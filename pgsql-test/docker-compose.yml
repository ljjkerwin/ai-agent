services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: pg_vector_db
    restart: always
    environment:
      POSTGRES_USER: ${MYSQL_USERNAME}
      POSTGRES_PASSWORD: ${MYSQL_PASSWORD}
      POSTGRES_DB: hello_pg
    ports:
      - "5432:5432"
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/postgres:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MYSQL_USERNAME} -d hello_pg"]
      interval: 30s
      timeout: 30s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8088:80"
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/pgadmin:/var/lib/pgadmin
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/login"]
      interval: 30s
      timeout: 30s
      retries: 3
    depends_on:
      - postgres

networks:
  default:
    name: common-network