services:
    es:
        build: ./elasticsearch
        container_name: es-dev
        ports:
            - "9200:9200"
        environment:
            - discovery.type=single-node
            - xpack.security.enabled=false
            - xpack.security.http.ssl.enabled=false
            - xpack.security.transport.ssl.enabled=false
            - ES_JAVA_OPTS=-Xms512m -Xmx512m
        volumes:
            - ${DOCKER_VOLUMN_DIRECTORY:-.}/volumes/es:/usr/share/elasticsearch/data
        restart: always

    kibana:
        image: kibana:8.17.0
        container_name: kibana-dev
        ports:
            - "5601:5601"
        environment:
            - ELASTICSEARCH_HOSTS=http://es:9200
        volumes:
            - ${DOCKER_VOLUMN_DIRECTORY:-.}/volumes/kibana:/usr/share/kibana/data
        depends_on:
            - es
        restart: always

networks:
    default:
        name: common-network
